<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand-Controlled Boss Fight Arena</title>
    <!-- P5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <!-- ML5.js -->
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #141414;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        font-family: monospace;
      }
      canvas {
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      }
      #youtube-player {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- Reproductor oculto para música de fondo vía YouTube -->
    <div id="youtube-player"></div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script src="scripts/visualEffects.js"></script>
    <script src="scripts/bot.js"></script>
    <script src="scripts/handHandler.js"></script>
    <script src="scripts/gestureAnalyzer.js"></script>
    <script src="scripts/UIManager.js"></script>
    <script src="scripts/AttackManager.js"></script>
    <script src="scripts/AdaptationManager.js"></script>
    <script src="scripts/MahoragaBot.js"></script>
    <script src="scripts/AudioManager.js"></script>
    <script src="scripts/sketch.js"></script>
  </body>
</html>
